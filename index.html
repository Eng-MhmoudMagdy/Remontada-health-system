<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroHealth | Crew Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="splash-screen" id="splash-screen">
        <div class="launch-track">
            <div class="rocket-vessel">
                <svg class="rocket-svg" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#E2E8F0"/>
                            <stop offset="50%" stop-color="#FFFFFF"/>
                            <stop offset="100%" stop-color="#94A3B8"/>
                        </linearGradient>
                    </defs>
                    <path d="M35 125 L12 162 L38 155 Z" fill="#0B3D91"/>
                    <path d="M85 125 L108 162 L82 155 Z" fill="#0B3D91"/>
                    <path d="M60 125 L60 165" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
                    <path d="M44 155 L76 155 L82 170 L38 170 Z" fill="#1E293B"/>
                    <path d="M60 15 C35 55, 35 110, 40 155 L80 155 C85 110, 85 55, 60 15 Z" fill="url(#bodyGrad)"/>
                    <path d="M60 15 C49 32, 44 48, 42 60 L78 60 C76 48, 71 32, 60 15 Z" fill="#00E5FF"/>
                    <circle cx="60" cy="92" r="14" fill="#0F172A" stroke="#00E5FF" stroke-width="3"/>
                    <circle cx="56" cy="88" r="4" fill="#FFFFFF" opacity="0.6"/>
                </svg>
                <div class="thruster-flame">
                    <div class="flame-outer"></div>
                    <div class="flame-inner"></div>
                </div>
            </div>
        </div>
        <p class="splash-caption">INITIALIZING Remontada...</p>
    </div>

    <canvas id="space-canvas"></canvas>

    <div class="celestial-bodies">
        <div class="realistic-sun">
            <div class="sun-ambient-haze"></div>
            <div class="sun-flare-horizontal"></div>
            <div class="sun-flare-diagonal-1"></div>
            <div class="sun-flare-diagonal-2"></div>
            <div class="sun-corona-glow"></div>
            <div class="sun-star-core"></div>
        </div>

        <div class="earth-wrapper">
            <div class="earth-sphere">
                <div class="earth-surface"></div>
                <div class="earth-clouds"></div>
                <div class="earth-atmosphere"></div>
            </div>
        </div>
    </div>

    <main class="ui-overlay" id="main-ui">
        <div class="astronaut-card" id="astronaut-login">
            <div class="avatar-ring">
                <svg class="astronaut-avatar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="visorGrad" cx="40%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#1E3A8A"/>
                            <stop offset="50%" stop-color="#09152E"/>
                            <stop offset="100%" stop-color="#020617"/>
                        </radialGradient>
                        <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF"/>
                            <stop offset="100%" stop-color="#CBD5E1"/>
                        </linearGradient>
                    </defs>
                    <rect x="44" y="112" width="112" height="68" rx="16" fill="#64748B"/>
                    <rect x="50" y="118" width="100" height="56" rx="12" fill="#94A3B8"/>
                    <path d="M32 195 C32 132, 168 132, 168 195 Z" fill="url(#suitGrad)"/>
                    <rect x="64" y="124" width="72" height="14" rx="7" fill="#1E293B"/>
                    <rect x="70" y="128" width="60" height="5" rx="2.5" fill="#00E5FF"/>
                    <circle cx="100" cy="80" r="54" fill="url(#suitGrad)"/>
                    <rect x="40" y="68" width="8" height="26" rx="4" fill="#475569"/>
                    <rect x="152" y="68" width="8" height="26" rx="4" fill="#475569"/>
                    <circle cx="44" cy="74" r="2" fill="#00E5FF"/>
                    <circle cx="156" cy="74" r="2" fill="#00E5FF"/>
                    <ellipse cx="100" cy="80" rx="40" ry="34" fill="url(#visorGrad)" stroke="#334155" stroke-width="2"/>
                    <path d="M70 62 Q100 46 130 64 Q116 74 96 69 Q76 66 70 62 Z" fill="#00E5FF" opacity="0.4"/>
                    <ellipse cx="80" cy="70" rx="7" ry="3.5" transform="rotate(-25 80 70)" fill="#FFFFFF" opacity="0.75"/>
                    <rect x="80" y="152" width="40" height="24" rx="5" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
                    <circle cx="91" cy="164" r="3.5" fill="#00C853"/>
                    <circle cx="103" cy="164" r="3.5" fill="#00E5FF"/>
                    <rect x="111" y="160" width="4" height="8" rx="1" fill="#FFD600"/>
                </svg>
            </div>
            <h2 class="astronaut-name">Cmdr. Alex Mercer</h2>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
